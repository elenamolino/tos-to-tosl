name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'metamodel/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

env:
  # Backend only — ICAN talks to the FastAPI job API on :8000, never to the
  # standalone Next.js report viewer under frontend/.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tos-to-odrl

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
