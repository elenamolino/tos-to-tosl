services:
  mongodb:
    image: mongo:7.0
    container_name: tos-to-odrl-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    # Published from this repo via .github/workflows/publish.yml. Use
    # `build: .` instead if you're iterating on backend/src code locally.
    image: ghcr.io/elenamolino/tos-to-odrl:latest
    container_name: tos-to-odrl-backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: tos_to_odrl
    env_file:
      - .env
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: tos-to-odrl-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
